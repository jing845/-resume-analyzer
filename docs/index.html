<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="对照目标岗位，找出简历的不足，并给出具体修改建议。">
  <title>AI 简历评估助手</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#202733;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75}main{width:min(100% - 40px,560px);margin:clamp(60px,15vh,150px) auto 40px}h1{font-size:clamp(26px,5vw,34px);letter-spacing:-.04em;line-height:1.35;margin:0 0 16px}p{margin:0;color:#59616d;font-size:16px}.steps{margin:30px 0;padding:20px 24px;background:#fff;border:1px solid #e4e6ea;border-radius:10px;list-style:none;counter-reset:step}.steps li{counter-increment:step;display:flex;align-items:center;gap:12px;padding:7px 0;font-size:15px}.steps li:before{content:counter(step);font-size:12px;background:#eef1f7;color:#466394;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}.start{display:block;text-align:center;padding:13px 20px;background:#325cc7;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:16px}.start:hover{background:#254aa7}.start:focus-visible,a:focus-visible{outline:3px solid #8fa8e6;outline-offset:4px}.note{font-size:13px;margin-top:12px;text-align:center;color:#737b87}footer{margin-top:44px;border-top:1px solid #e4e6ea;padding-top:16px;display:flex;justify-content:space-between;gap:20px;color:#8a9099;font-size:12px}footer a{color:#6c7480;text-decoration:none}@media(max-width:480px){main{margin-top:64px}.steps{padding:16px 18px}footer{margin-top:32px}}
  </style>
</head>
<body>
  <main>
    <h1>AI 简历评估助手</h1>
    <p>对照目标岗位，找出简历的不足，<br>并给出具体修改建议。</p>
    <ol class="steps" aria-label="使用步骤">
      <li>粘贴简历，或上传简历文件</li>
      <li>粘贴目标岗位要求</li>
      <li>获得分析和修改建议</li>
    </ol>
    <a class="start" href="https://jf4mohp3dpaygr26enr5oj.streamlit.app/">开始评估我的简历 →</a>
    <p class="note">进入工具后填写，无需注册。首次打开可能需要等待启动。</p>
    <footer><span>个人 AI 产品项目</span><a href="https://github.com/jing845/-resume-analyzer">项目源码</a></footer>
  </main>
</body>
</html>
